events { 

}
http {
	 server {
	 listen 3000;
	 listen [::]:3000;
	 server_name photoshack;
	 location / {
			proxy_pass http://ps_client:3000;       
			proxy_http_version 1.1;        
			proxy_set_header Upgrade $http_upgrade;               
			proxy_set_header Connection ‘upgrade’;
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
	 }

	 } 
	 server {
	 listen 8080;
	 listen [::]:8080;
	 server_name photoshack;
	 location / {
			proxy_pass http://ps_server:3001;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection ‘upgrade’;
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
	 }
	 }
}
